name: notebooks

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Detect notebook changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(notebooks/|requirements\.txt|scripts/run-notebooks\.sh|\.github/workflows/notebooks\.yml)'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.changed == 'true'
        with:
          python-version: "3.12"
      - name: Install notebook tooling
        if: steps.detect.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Register CI kernel
        if: steps.detect.outputs.changed == 'true'
        run: |
          python -m ipykernel install --user --name=ci-kernel
          jupyter kernelspec list
      - name: Verify no outputs are committed
        if: steps.detect.outputs.changed == 'true'
        run: python -m nbstripout --verify notebooks/*.ipynb
      - name: Execute notebooks
        if: steps.detect.outputs.changed == 'true'
        run: bash scripts/run-notebooks.sh ci-kernel 600
