name: ci

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
