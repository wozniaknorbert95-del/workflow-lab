name: daily-digest

on:
  schedule:
    # Changed from daily to 3x per week (Mon/Wed/Fri at 07:30 Europe/Warsaw)
    - cron: "30 5 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

jobs:
  post-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post digest to tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DIGEST_HEADING: "Digest"
          POST_COMMENT: "true"
          TRACKING_ISSUE: "44"
        run: node scripts/daily-digest.mjs
