name: weekly-security-sweep

on:
  # Phase 1: manual-only — run from Actions tab or morning ritual checklist.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-sweep-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open weekly security sweep issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POST_ISSUE: "true"
        run: node scripts/weekly-security-sweep.mjs
