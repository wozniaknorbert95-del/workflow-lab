stages:
  - validate
  - test
  - build
  - notebooks

lint:
  stage: validate
  image: node:20
  interruptible: true
  script:
    - npm run lint

unit-tests:
  stage: test
  image: node:20
  interruptible: true
  script:
    - npm test

build:
  stage: build
  image: node:20
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

notebooks:
  stage: notebooks
  image: python:3.12
  interruptible: true
  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python -m ipykernel install --user --name=ci-kernel
    - python -m nbstripout --verify notebooks/*.ipynb
    - bash scripts/run-notebooks.sh ci-kernel 600

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
